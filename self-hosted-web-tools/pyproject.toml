[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "self-hosted-web-tools"
version = "0.1.0"
description = "Self-hosted search, extraction, browsing and downloads for HTTP and MCP agents"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<0.29",
  "httpcore>=1.0.9,<2", "mcp>=1.26,<2", "pydantic-settings>=2.7,<3",
  "trafilatura>=2.0,<3", "playwright>=1.51,<2", "aiosqlite>=0.21,<1",
  "aiofiles>=24.1,<26", "pypdf>=6.20.1,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "build>=1.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/web_tools"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["browser: launches real Chromium", "integration: runs a real local HTTP service"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
